name: CI

on:
  push:
    branches: [main]
  pull_request:

# The URL guard and the smoke tests only protect the site if they run without
# anyone having to remember. That is the entire point of this file.
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, because the sitemap needs it.
          #
          # build-sitemap-dates.mjs falls back to a file's last commit date for
          # any page without a date in its frontmatter — the map stages, the
          # checks, the standalone pages. A shallow clone has no such history,
          # so those dates were silently dropped and the sitemap shipped with
          # 20 of 39 URLs missing a lastmod. It passed locally, where the clone
          # is complete, and failed only here.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Types
        run: npx astro check

      - name: Build
        run: npm run build

      - name: URL contract
        run: npm run audit:urls

      - name: Performance budget
        run: npm run audit:budget

      - name: Quality backlog is in sync with itself
        run: npm run audit:quality

      - name: Prose follows BRAND.md
        run: npm run audit:prose

      - name: Install browsers
        run: npx playwright install --with-deps chromium webkit

      - name: Smoke tests
        run: npm test

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
