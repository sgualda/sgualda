name: "Reversible decision"
definition: "One you could undo quickly and quietly, where almost nobody outside the team would notice and nothing else gets built on top. How long a decision deserves depends on this, not on how important it feels."
note: "The test is whether you can say how you would undo it in one sentence. If you cannot, it’s not reversible — you are hoping it is."
topics:
  - "scope"
tool: "should-you-decide-now-or-think-longer"
stage: "first-version"
