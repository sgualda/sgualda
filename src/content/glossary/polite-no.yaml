name: "Polite no"
definition: "Enthusiasm expressed after a demo, with no existing workaround behind it and no repeat use after it. It’s indistinguishable from real interest at the moment it happens, which is what makes it expensive."
note: "“That’s interesting” is what a considerate person says instead of “no”."
topics:
  - "discovery"
  - "measurement"
tool: "is-user-feedback-real-or-just-polite"
