name: "One-way door"
definition: "A decision you live with rather than reverse: pricing customers have seen, a hire, a market, a promise made in public. Everything built afterwards inherits its shape."
note: "The failure mode here is not haste. It is agreement — nobody in the room disagreeing is a reason to look outside it."
topics:
  - "scope"
tool: "should-you-decide-now-or-think-longer"
stage: "charging-for-it"
