name: "Eight-second test"
definition: "Show your homepage to five people for eight seconds, hide it, and ask what the product does. If two are wrong, the problem is what you are saying rather than how many people you are reaching."
note: "Costs an afternoon and settles an argument that otherwise gets answered with an advertising budget."
topics:
  - "launch"
tool: "why-is-nobody-using-your-product"
