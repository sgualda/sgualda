# Stage 01 — Worth building?

n: "01"
name: "Worth building?"
lead: "Before you build anything. Most of the cost is decided here."
meta: "Most of what a product costs is decided before anybody builds anything. How to tell a real problem from an idea you like, and what to look for first."
question: "Is there a problem here worth anyone’s time?"
x: 6
y: 72
tools:
  - "is-user-feedback-real-or-just-polite"
  - "is-this-feature-worth-building"
body:
  - "Nobody skips this stage. They just do it badly — in their head, on a walk — and call
    the result conviction."
  - "I spent most of one summer building a tool for organising interview notes. I was sure
    about it. I’d the problem myself, which felt like the strongest possible evidence, and
    I never checked whether anyone else did. Six people told me it sounded useful. Not one
    of them had ever done anything about the problem before I described it to them. That
    should have been the end of the conversation, and instead it was the beginning of three
    months."
  - "What I got wrong was the question. I was asking whether the idea was good, and
    everybody is polite about ideas. <strong>Now I ask whether anybody is already solving
    this badly, by hand.</strong> A spreadsheet somebody maintains on Sundays. A group chat
    with a naming convention nobody agreed to. A recurring reminder to check something
    manually."
  - "That ugly thing is the proof, and it’s worth more than any amount of agreement. If
    nobody has built the ugly version, the pain is probably not there yet — which is not a
    verdict on the idea, only on the timing."
traps:
  - "Asking people whether they would use it. They will say yes, because saying no to
    somebody’s idea is rude. Ask what they did the last time the problem happened instead."
  - "Counting your own excitement as demand. It’s the least reliable signal available and
    the one you have the most of."
  - "Researching until it feels safe. It never will. Past a certain point you’re collecting
    reassurance, not information."
signal: "You can name two people — actual people, not job titles — who already do this the
  hard way."
cta:
  title: "A working session on whether to build it"
  body: "Bring the idea and whatever you have heard about it so far. We work out together
    whether there’s a real problem underneath, and you leave with a decision rather than a
    maybe."
