# Why is nobody using your product?
# Questions, outcomes and FAQs for one free check.

cat: "growth"
n: "Why is nobody using your product?"
time: "40 seconds"
count: "3 questions"
title: "Why is nobody using your product?"
meta: "Answer three questions about your launch and find out which of five reasons is behind
  a flat usage graph — and which fixes are a waste of time for your case. Free, no account,
  nothing saved."
lead: "You launched and the graph is flat. Five completely different reasons look identical
  from the outside, and their fixes point in opposite directions — so guessing wrong costs
  you a quarter. Three questions and you get which one you’re in."
out: "Which of the five you’re in, why the other four are not it, and the cheap test that
  confirms it."
answers:
  - - "Nobody saw it"
    - "A reach problem, and the only one where more traffic is the answer."
  - - "They saw it and did not understand it"
    - "Usually read as a traffic problem and answered with a bigger budget."
  - - "They did not need it"
    - "The expensive one. Neither traffic nor a better product fixes it."
  - - "Moving to you was too much work"
    - "The problem is real. Switching costs them an afternoon they do not have."
  - - "It’s not good enough yet"
    - "The only one where “make it better” is genuinely the right answer."
faqs:
  - - "Why is nobody using my product?"
    - "There are five common reasons and in analytics they look identical: nobody saw it;
      they saw it and did not understand what it was; they understood it and did not need
      it; they needed it but moving off what they use today was too much work; or they tried
      it and it’s not good enough yet. The fixes point in opposite directions, which is why
      the diagnosis matters more than the effort. More traffic only helps the first one and
      a better product only helps the last one."
  - - "Does more marketing fix low usage?"
    - "Only if the reason is that nobody saw it. If people arrive and leave within seconds,
      more traffic sends more people to the same sentence that’s already not working. If
      they arrive and do not need what you built, more traffic sends more people to
      something they also do not need — at a higher cost each time."
  - - "How do I know if people actually need my product?"
    - "Ask what they do about the problem today. People who genuinely have a problem have
      already built something ugly and manual to cope with it — a spreadsheet, a group chat,
      a recurring reminder. When nobody can describe any workaround at all, that’s usually
      the finding, and it’s worth one afternoon of conversations to confirm before spending
      another quarter."
q:
  - - "What happens when somebody lands on your page?"
    - - - "Almost nobody lands there at all"
        - 4
      - - "They land and leave within seconds"
        - 3
      - - "They sign up, then stop"
        - 1
      - - "They use it a bit, then drift away"
        - 0
  - - "When you ask people what they do today instead, what do they say?"
    - - - "They describe an ugly workaround they hate"
        - 0
      - - "They have a workaround and seem fine with it"
        - 2
      - - "Nothing. They have never had to solve this"
        - 4
  - - "Of the people who tried it, how many came back on their own?"
    - - - "Several, more than once"
        - 0
      - - "One or two"
        - 2
      - - "None"
        - 4
b:
  - max: 2
    name: "They came back. It’s just not good enough yet."
    sub: "The best of the five, and the only one where “make the product better” is actually the
      right answer."
    body: "<p>They found it, understood what it was, tried it, and some came back without being
      reminded. That last part is the only signal I really trust, and you have it.</p><p>It
      is also the one people assume they’re in most often, usually wrongly, because it’s
      the most flattering explanation available. <strong>If nobody came back on their own,
      you’re not here.</strong></p>"
    next:
      - "Ask the people who came back what they almost gave up on. Push past their first,
        polite answer."
      - "Fix what appears in two of those conversations, not what appears in one."
      - "Do not start marketing yet. Pushing more people through a nearly-good product
        wastes the introduction."
  - max: 5
    name: "They want it. Moving to you is too much work."
    sub: "The problem is real and they agree. Switching would still cost them an afternoon they
      do not have."
    body: "<p>They have a workaround, they do not love it, and they still have not moved. That
      gap is almost never about missing features — teams keep tools they openly complain
      about for years.</p><p>It’s about the cost of moving: their data is elsewhere, their
      colleague knows the old thing, and switching means being slower for a week to be
      faster later. <strong>Most people will not take that trade even when the maths is
      obviously in their favour.</strong></p>"
    next:
      - "Write down every single thing somebody must do before they get any value."
      - "Delete or automate half of them. Import from where their data already lives, even
        badly."
      - "Make it useful before setup is finished, not after."
  - max: 8
    name: "They saw it and did not understand it."
    sub: "People arrive and leave within seconds. That’s what you’re saying, not how many
      people you’re reaching."
    body: "<p>This gets misdiagnosed as a traffic problem more than any other, and answered with
      a bigger ad budget — which sends more people to the same sentence that’s already not
      working.</p><p>Cheapest test I know, and it takes an afternoon: <strong>show your
      homepage to five people for eight seconds, hide it, and ask what the product
      does.</strong> If two are wrong, you’re here. Not partly wrong — wrong.</p>"
    next:
      - "Run the eight-second test on five people who do not know what you do."
      - "Rewrite the first sentence in their words, not your internal ones."
      - "Say what it replaces. “Instead of X” lands faster than any description of what you
        built."
  - max: 99
    name: "They did not need it."
    sub: "The expensive one, and the one everybody spends months avoiding."
    body: "<p>Nobody can describe a workaround and nobody came back. That combination has one
      boring explanation, and it’s the one nobody wants: <strong>the problem is not painful
      enough to act on.</strong></p><p>What makes it expensive is that both escape routes
      are dead ends. Distribution does not fix it — more people arrive at something they
      also do not need. A better product does not fix it either, because quality was never
      the objection.</p><p>The good news: it’s the cheapest one to <em>confirm</em>. One
      afternoon and nine honest conversations about the last time the problem actually
      happened to them.</p>"
    next:
      - "Talk to nine people. Ask only about the last time it happened, and never mention
        your product."
      - "Count how many had done something manual and annoying about it. Under three,
        believe it."
      - "Look for the adjacent problem instead of rebuilding. It’s usually one step away,
        with the same users."
