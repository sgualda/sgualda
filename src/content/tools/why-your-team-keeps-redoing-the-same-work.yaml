# Why does your team keep redoing the same work?
# Questions, outcomes and FAQs for one free check.

cat: "team"
n: "Why does your team keep redoing the same work?"
time: "40 seconds"
count: "4 questions"
title: "Why Does Your Team Keep Redoing The Same Work? — Free Check"
meta: "Four questions find out why settled decisions keep coming back and work gets thrown
  away — and the smallest change that stops it. Free, forty seconds, nothing saved."
lead: "You ship constantly and it does not feel like progress. Decisions come back, work
  gets thrown away, and the same argument returns every few weeks. Four questions and you
  will know which of four causes it is."
out: "Which of four things is causing it, and the smallest change that stops it."
answers:
  - - "This is normal"
    - "Work gets redone because you learned something. That’s not waste."
  - - "Decisions are not written down"
    - "Made in conversation, remembered differently, quietly relitigated."
  - - "Somebody is left out of the room"
    - "The same objection, arriving at the most expensive moment."
  - - "Nobody can end an argument"
    - "Decisions are not made, they’re abandoned — and abandoned things come back."
faqs:
  - - "Why does my team keep redoing the same work?"
    - "Usually one of four reasons: you genuinely learned something new, which is not waste;
      decisions are made in conversation and never written down, so they get remembered
      differently and quietly relitigated; somebody with real veto power finds out too late
      and objects when the work is already done; or nobody is able to end an argument, so
      decisions are abandoned rather than made."
  - - "How should a small team record decisions?"
    - "One running page, newest at the top, four lines per decision: what was decided, why,
      what was rejected, and what would change it. It takes ten minutes a week and it ends
      the category of argument where everyone remembers the same meeting differently.
      Anything heavier will be abandoned within a month."
  - - "Who should make the final decision in a product team?"
    - "Name one person per area, chosen by who lives with the consequences rather than by
      seniority, and say it out loud in writing. Everyone else gets the right to be heard
      before the decision and no right to reopen it afterwards. Consensus is a good input
      and a terrible decision rule, because anything that cannot be closed comes back."
q:
  - - "How do decisions get recorded?"
    - - - "Written down where anyone can find them"
        - 0
      - - "In a doc one person owns"
