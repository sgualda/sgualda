b:
  - max: 3
    name: "This is normal. Do not fix it."
    sub: "Work gets redone because new information arrived, and decisions mostly stay decided."
    body: "<p>Redoing work in response to something you learned is not waste — it’s the entire
      point of working iteratively. The waste is redoing it because nobody remembered why it
      was decided.</p><p><strong>You do not have a process problem.</strong> Adding process
      here would slow you down and solve nothing, which is the most common way good teams
      get worse.</p>"
    next:
      - "Leave it alone."
      - "If it starts to hurt, run this again. The answer will change."
      - "Spend the energy you were about to spend on process on talking to users instead."
  - max: 8
    name: "Your decisions are not written down."
    sub: "They are made in conversation, remembered differently by everyone, and quietly
      relitigated later."
    body: "<p>The tell is arguments that feel familiar. Nobody is being difficult — they
      genuinely remember it differently, and without a record the loudest or most recent
      version wins.</p><p>The fix is smaller than any process anyone will propose in
      response. <strong>Four lines, written the day of the decision: what we decided, why,
      what we rejected, what would change it.</strong> Ten minutes, and it ends the
      category.</p>"
    next:
      - "Start a single running document. One page, newest at the top, nothing fancy."
      - "Four lines per decision. What, why, what we rejected, what would change it."
      - "When an old argument returns, do not re-argue it. Link the entry and move on."
  - max: 12
    name: "Somebody is being left out of the room."
    sub: "Work gets redone because a person who could have objected found out too late."
    body: "<p>This is usually structural rather than personal. Someone with real veto power — an
      engineer who knows what is expensive, a support lead who knows what breaks — is not
      present when the decision happens, and finds out when the work is already
      done.</p><p>By then their objection costs a rebuild, so it feels like obstruction.
      <strong>It’s not obstruction. It’s the same objection, arriving at the most
      expensive possible moment.</strong></p>"
    next:
      - "List the last three things that got redone. Write down who objected each time."
      - "If it’s the same name, they belong in the room before the decision, not after."
      - "Ask them directly what they would have said. It takes five minutes and saves weeks."
  - max: 99
    name: "Nobody can end an argument."
    sub: "Decisions do not get made, they get abandoned — and anything abandoned comes back."
    body: "<p>Nothing is written down, decisions return every sprint, and no one person can
      close a discussion. That’s not a communication problem. It’s <strong>an unclear
      owner,</strong> and it’ll not be fixed by a better tool or a longer
      meeting.</p><p>The uncomfortable part is that the fix is not more consensus. It’s
      naming who decides when there’s no consensus — and accepting that being overruled
      sometimes is the price of moving.</p>"
    next:
      - "Name the decider for each area, in writing. Not by seniority — by who lives with
        the consequences."
      - "Give everyone else the right to be heard before, and no right to reopen it after."
      - "Write down what was decided, or the previous point does not hold."
