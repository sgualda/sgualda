# Can you charge for this yet?
# Questions, outcomes and FAQs for one free check.

cat: "growth"
n: "Can you charge for this yet?"
time: "40 seconds"
count: "4 questions"
title: "Can You Charge For Your Product Yet? — Free Check"
meta: "Four questions on willingness to pay tell you whether you’re ready to put a price on
  it, or whether charging now would teach you the wrong thing. Free, forty seconds, nothing
  saved."
lead: "You’re wondering whether to put a price on it, or whether it’s too early and asking
  for money would kill the momentum you have. Four questions and you will know which."
out: "Whether you’re ready to charge, and what to fix first if you’re not."
answers:
  - - "Charge now"
    - "People ask the price, already pay for something worse, and would notice if it
      vanished."
  - - "Charge, but keep it simple"
    - "Demand is real. Your explanation of the value is not ready."
  - - "Not yet"
    - "Nobody has asked what it costs. That’s the signal."
  - - "Charging now would teach you the wrong thing"
    - "A few sympathetic payments look like validation and are not."
faqs:
  - - "How do I know if I can charge for my product yet?"
    - "The strongest signal is people asking what it costs before you bring price up. After
      that: whether they already pay for something to solve this problem, whether anyone
      would complain if you switched it off tomorrow, and whether you can say in one
      sentence what somebody gets for the money without having to explain it."
  - - "Should I launch free and charge later?"
    - "Free is a reasonable place to be while you’re still learning what the product is,
      but it teaches you almost nothing about what somebody will pay for. Free users
      tolerate things paying users will not, and the switch later is harder than introducing
      a price early. If people are already asking the price, waiting is costing you
      information as well as money."
  - - "How should I price a new product?"
    - "Start with one price, one sentence and one thing it does. Tiers are almost always a
      symptom of not being sure what you’re selling, and users read that uncertainty
      accurately. The first number will be wrong, which is fine — a price is much easier to
      change than to introduce."
